name: SSH builder experiment

on:
  push:
    branches: [ci/remote-builder]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ssh-builder:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@d9186cbdca7adedf113a159fa91f725a27866771 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.7/install
      - run: |
          sudo apt-get update
          sudo apt-get install -y uidmap slirp4netns fuse-overlayfs
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build over SSH with local builds disabled
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .coldeer
          nix develop --command bash tools/remote-builder-e2e.sh 2>&1 | tee .coldeer/remote-builder.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ssh-builder-log
          path: .coldeer/remote-builder.log
          retention-days: 7
